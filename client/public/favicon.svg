<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Glow & Outer Shield Shape -->
  <path d="M32 4L10 12V28C10 44 19.5 54 32 60C44.5 54 54 44 54 28V12L32 4Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Inner Shield -->
  <path d="M32 8L14 15V27C14 41 21.8 50 32 55.5C42.2 50 50 41 50 27V15L32 8Z" fill="url(#innerGrad)"/>

  <!-- Lock Body -->
  <rect x="23" y="27" width="18" height="15" rx="3.5" fill="url(#shieldGrad)"/>
  
  <!-- Lock Shackle -->
  <path d="M26 27V21C26 17.6863 28.6863 15 32 15C35.3137 15 38 17.6863 38 21V27" stroke="url(#shieldGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="32" cy="33" r="2" fill="#ffffff"/>
  <path d="M31.2 33.5L30.8 38H33.2L32.8 33.5H31.2Z" fill="#ffffff"/>
</svg>
